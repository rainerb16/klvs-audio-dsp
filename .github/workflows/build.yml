name: Build

on:
  push:
    branches: ["**"]
    tags: ["wrm1-v*"]   # a version tag also publishes a GitHub Release (see the release job)
    paths-ignore: ["**.md", "dsp-lab/**", "docs/**"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job may write (create the release).
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN: WRM1
  PLUGINVAL_VERSION: v1.0.4
  # SHA-256 of the pluginval release zips, pinned when first downloaded (2026-10-24). A changed
  # download fails the build instead of running unknown code.
  PLUGINVAL_SHA256_macOS: 3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f
  PLUGINVAL_SHA256_Windows: c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14            # Apple Silicon runner; builds universal x86_64 + arm64
            configure: -DRAINR_UNIVERSAL=ON
            targets: --target WRM1_VST3 --target WRM1_AU --target WRM1Tests
          - name: Windows
            os: windows-latest
            configure: ""
            targets: --target WRM1_VST3 --target WRM1Tests

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Read version
        shell: bash
        run: echo "VERSION=$(head -n1 plugins/$PLUGIN/VERSION | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 ${{ matrix.targets }}

      # The C++ engine against the Python reference (tests/golden), plus latency, block-size and
      # stability checks. Fails the build if the sound drifts from the spec.
      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      # This runner is Apple Silicon; run the same tests on the Intel half via Rosetta.
      - name: Engine tests (Intel slice, Rosetta)
        if: runner.os == 'macOS'
        run: |
          /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 build/tests/WRM1Tests_artefacts/Release/WRM1Tests

      - name: Locate plugins
        shell: bash
        run: |
          ART=build/plugins/$PLUGIN/${PLUGIN}_artefacts/Release
          echo "VST3_PATH=$ART/VST3/$PLUGIN.vst3" >> "$GITHUB_ENV"
          echo "AU_PATH=$ART/AU/$PLUGIN.component" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- macOS
      - name: Check architectures and minimum macOS
        if: runner.os == 'macOS'
        run: |
          for b in "$VST3_PATH" "$AU_PATH"; do
            archs=$(lipo -archs "$b/Contents/MacOS/$PLUGIN")
            echo "$b: $archs"
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "::error::$b is not universal"; exit 1; }
            vtool -show-build "$b/Contents/MacOS/$PLUGIN" | grep -q "minos 11.0" || { echo "::error::$b minimum macOS is not 11.0"; exit 1; }
          done

      # Unsigned builds: an ad-hoc signature (no Apple account) is still required for
      # Apple Silicon Macs to load the plugin. JUCE leaves the AU unsigned.
      - name: Ad-hoc sign
        if: runner.os == 'macOS'
        run: |
          for b in "$VST3_PATH" "$AU_PATH"; do
            codesign --force --deep -s - "$b"
            codesign --verify --deep --strict "$b"
          done

      - name: Apple AU validation (auval)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$AU_PATH" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i rnra || true
          auval -strict -v aufx Wrm1 Rnra

      # ---------------------------------------------------------------- package
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          OUT="Rainr-$PLUGIN-$VERSION-macOS"
          mkdir -p "dist/$OUT"
          cp -R "$VST3_PATH" "$AU_PATH" "dist/$OUT/"
          sed "s/{PLUGIN}/$PLUGIN/g; s/{VERSION}/$VERSION/g" packaging/README-macOS.txt > "dist/$OUT/README.txt"
          # ditto keeps the bundles' permissions and signatures intact (plain zip may not)
          ditto -c -k --keepParent "dist/$OUT" "dist/$OUT.zip"
          echo "PKG=dist/$OUT.zip" >> "$GITHUB_ENV"
          echo "PKG_NAME=$OUT" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          OUT="Rainr-$PLUGIN-$VERSION-Windows"
          mkdir -p "dist/$OUT"
          cp -R "$VST3_PATH" "dist/$OUT/"
          sed "s/{PLUGIN}/$PLUGIN/g; s/{VERSION}/$VERSION/g" packaging/README-Windows.txt | sed 's/$/\r/' > "dist/$OUT/README.txt"
          (cd dist && 7z a -tzip "$OUT.zip" "$OUT" > /dev/null)
          echo "PKG=dist/$OUT.zip" >> "$GITHUB_ENV"
          echo "PKG_NAME=$OUT" >> "$GITHUB_ENV"

      # Downloadable builds only come from pushes to this repo, never from pull requests
      # (a fork's pull request must not produce a zip that looks like an official build).
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ${{ env.PKG_NAME }}
          path: ${{ env.PKG }}
          retention-days: 30

      # Runs after packaging, so the validator can't touch what gets shipped. A failure still
      # fails the run, which blocks the release job.
      - name: pluginval (strictest)
        shell: bash
        run: |
          curl -sSfL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_VERSION/pluginval_${RUNNER_OS}.zip"
          EXPECTED="PLUGINVAL_SHA256_${RUNNER_OS}"
          ACTUAL=$( (sha256sum pluginval.zip 2>/dev/null || shasum -a 256 pluginval.zip) | cut -d' ' -f1)
          [[ "$ACTUAL" == "${!EXPECTED}" ]] || { echo "::error::pluginval download hash mismatch ($ACTUAL)"; exit 1; }
          7z x -y pluginval.zip > /dev/null
          if [[ "$RUNNER_OS" == "macOS" ]]; then PV=pluginval.app/Contents/MacOS/pluginval; else PV=./pluginval.exe; fi
          "$PV" --strictness-level 10 --verbose --validate "$VST3_PATH"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "--- Intel slice (Rosetta)"
            arch -x86_64 "$PV" --strictness-level 10 --validate "$VST3_PATH"
          fi

  # Pushing a tag like wrm1-v0.1.0 publishes both zips on the Releases page, where anyone can
  # download them without a GitHub account. Marked as a pre-release while builds are unsigned.
  release:
    if: startsWith(github.ref, 'refs/tags/wrm1-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only release commits that are already on main (not an unmerged branch).
      - name: Check the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Check tag matches plugins/WRM1/VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#wrm1-v}"
          FILE_VERSION="$(head -n1 plugins/WRM1/VERSION | tr -d '\r')"
          [[ "$TAG_VERSION" == "$FILE_VERSION" ]] || { echo "::error::tag $GITHUB_REF_NAME but VERSION is $FILE_VERSION"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#wrm1-v}"
          cat > notes.md <<EOF
          Test build of WRM1 $VERSION. Unsigned: follow the install steps in
          [docs/INSTALL.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/INSTALL.md).
          What changed: see [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" \
            --title "WRM1 $VERSION (test build)" --notes-file notes.md --prerelease
